<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/dashboard.css">

    <!-- ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<header class="header">
    <div class="header-content">
        <h2>Quantity Measurement</h2>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</header>

<div class="main-wrapper">

    <!-- TYPE -->
    <h3 class="section-title">CHOOSE TYPE</h3>
    <div class="type-grid">

        <div class="type-card active" onclick="setType('LengthUnit', this)">
            <i class="ri-ruler-line icon"></i>
            <span>Length</span>
        </div>

        <div class="type-card" onclick="setType('WeightUnit', this)">
            <i class="ri-scales-3-line icon"></i>
            <span>Weight</span>
        </div>

        <div class="type-card" onclick="setType('TemperatureUnit', this)">
            <i class="ri-temp-hot-line icon"></i>
            <span>Temperature</span>
        </div>

        <div class="type-card" onclick="setType('VolumeUnit', this)">
            <i class="ri-cup-line icon"></i>
            <span>Volume</span>
        </div>

    </div>

    <!-- ACTION -->
    <h3 class="section-title">CHOOSE ACTION</h3>
    <div class="action-grid">
        <button class="action-btn" onclick="setAction('compare', this)">Comparison</button>
        <button class="action-btn" onclick="setAction('convert', this)">Conversion</button>
        <button class="action-btn active" onclick="setAction('arithmetic', this)">Arithmetic</button>
    </div>

    <!-- CALCULATOR -->
    <div class="calculator-card">

        <div class="input-group">

            <div class="input-field">
                <label>VALUE 1</label>
                <input type="number" id="value1" value="1">
                <select id="unit1"></select>
            </div>

            <div class="operator-container">
                <select id="operator" class="operator-dropdown">
                    <option value="add">+</option>
                    <option value="subtract">-</option>
                    <option value="divide">/</option>
                </select>
                <div id="arrow" class="operator-box" style="display:none;">→</div>
            </div>

            <div class="input-field">
                <label>VALUE 2</label>
                <input type="number" id="value2" value="1">
                <select id="unit2"></select>
            </div>

        </div>

        <button class="calculate-btn" onclick="calculate()">View Result</button>

        <div id="result-box" class="result-display" style="display:none;">
            <h2 id="result-text"></h2>
        </div>

    </div>

</div>

<script src="../js/dashboard.js"></script>
</body>
</html>
